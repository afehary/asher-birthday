<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asher Turns ONE 🎂</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .pin-input:focus { border-color: #3F9AAE !important; }
    </style>
</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #79C9C5 0%, #FFE2AF 50%, #3F9AAE 100%);">
    <div x-data="eventApp()" x-init="init()" x-cloak class="max-w-lg mx-auto p-4 pb-24">

        <!-- Header -->
        <header class="text-center py-6">
            <h1 class="text-3xl font-bold" style="color: #3F9AAE;">Asher Turns ONE</h1>
            <p class="text-gray-600 mt-1">🎂 Birthday Celebration 🎈</p>
        </header>

        <!-- Admin Badge -->
        <div x-show="isAdmin" class="text-white text-center py-2 px-4 rounded-lg mb-4 font-semibold" style="background-color: #3F9AAE;">
            🎤 MC Mode Active
        </div>

        <!-- Event List -->
        <div class="space-y-3">
            <template x-for="(event, index) in events" :key="index">
                <div
                    @click="toggleExpand(index)"
                    :class="{
                        'bg-green-100 border-green-400': event.status === 'completed',
                        'bg-yellow-100 border-yellow-400 ring-2 ring-yellow-400': event.status === 'ongoing',
                        'bg-white border-gray-200': event.status === 'pending'
                    }"
                    class="border-2 rounded-xl p-4 transition-all duration-300 cursor-pointer select-none"
                >
                    <!-- Main Event Row -->
                    <div class="flex items-start gap-3">
                        <!-- Status Icon -->
                        <div class="flex-shrink-0 mt-1">
                            <span x-show="event.status === 'completed'" class="text-2xl">✅</span>
                            <span x-show="event.status === 'ongoing'" class="text-2xl animate-pulse">🔴</span>
                            <span x-show="event.status === 'pending'" class="text-2xl">⏳</span>
                        </div>

                        <!-- Event Content -->
                        <div class="flex-1">
                            <h3
                                :class="{'line-through text-gray-400': event.status === 'completed'}"
                                class="font-semibold text-lg"
                                x-text="event.title"
                            ></h3>
                            <p
                                x-show="!isExpanded(index)"
                                :class="{'text-gray-400': event.status === 'completed'}"
                                class="text-sm text-gray-600 mt-1"
                                x-text="event.description"
                            ></p>
                        </div>

                        <!-- Admin Controls -->
                        <div x-show="isAdmin" class="flex-shrink-0">
                            <button
                                x-show="event.status === 'pending'"
                                @click.stop="startEvent(index)"
                                class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg font-bold text-sm active:scale-95 transition-transform"
                            >
                                START
                            </button>
                            <button
                                x-show="event.status === 'ongoing'"
                                @click.stop="completeEvent(index)"
                                class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm active:scale-95 transition-transform"
                            >
                                DONE
                            </button>
                            <button
                                x-show="event.status === 'completed'"
                                @click.stop="resetEvent(index)"
                                class="bg-gray-400 hover:bg-gray-500 text-white px-3 py-2 rounded-lg text-sm active:scale-95 transition-transform"
                            >
                                ↩️
                            </button>
                        </div>
                    </div>

                    <!-- Sub-Events (expandable) -->
                    <div
                        x-show="isExpanded(index)"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 -translate-y-2"
                        x-transition:enter-end="opacity-100 translate-y-0"
                        class="mt-3 ml-9 space-y-2"
                    >
                        <template x-for="(subEvent, subIndex) in event.subEvents" :key="subIndex">
                            <div
                                :class="{
                                    'text-gray-400': event.status === 'completed',
                                    'text-gray-700': event.status !== 'completed'
                                }"
                                class="flex items-start gap-2 text-sm"
                            >
                                <span class="text-xs mt-0.5">•</span>
                                <span x-text="subEvent"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="text-center py-8">
            <div class="animate-spin text-4xl">🎂</div>
            <p class="text-gray-500 mt-2">Loading...</p>
        </div>

        <!-- Admin Reset All Button -->
        <div x-show="isAdmin" class="mt-6">
            <button
                @click="resetAll()"
                class="w-full bg-red-100 hover:bg-red-200 text-red-600 py-3 rounded-lg font-semibold border-2 border-red-300"
            >
                🔄 Reset All Events
            </button>
        </div>

        <!-- MC Login Button (bottom right) -->
        <button
            x-show="!isAdmin"
            @click="showPinModal = true"
            class="fixed bottom-4 right-4 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl active:scale-95 transition-transform"
            style="background-color: #3F9AAE;"
        >
            🎤
        </button>

        <!-- Admin Logout Button -->
        <button
            x-show="isAdmin"
            @click="logout()"
            class="fixed bottom-4 right-4 bg-gray-600 hover:bg-gray-700 text-white px-4 py-3 rounded-full shadow-lg flex items-center justify-center text-sm font-semibold active:scale-95 transition-transform"
        >
            Exit MC Mode
        </button>

        <!-- PIN Modal -->
        <div
            x-show="showPinModal"
            x-transition
            class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"
            @click.self="showPinModal = false; pin = ''; pinError = false"
        >
            <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-xl">
                <h2 class="text-xl font-bold text-center mb-4">🎤 MC Login</h2>

                <input
                    type="password"
                    inputmode="numeric"
                    maxlength="4"
                    x-model="pin"
                    @keyup.enter="checkPin()"
                    placeholder="Enter 4-digit PIN"
                    :class="{'border-red-500 shake': pinError}"
                    class="pin-input w-full text-center text-2xl tracking-widest border-2 border-gray-300 rounded-lg py-3 focus:outline-none"
                >

                <p x-show="pinError" class="text-red-500 text-sm text-center mt-2">Wrong PIN</p>

                <button
                    @click="checkPin()"
                    class="w-full text-white py-3 rounded-lg font-semibold mt-4 active:scale-95 transition-transform"
                    style="background-color: #3F9AAE;"
                >
                    Enter
                </button>

                <button
                    @click="showPinModal = false; pin = ''; pinError = false"
                    class="w-full text-gray-500 py-2 mt-2"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <style>
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>

    <script>
        const ADMIN_PIN = '1212';

        // Fixed JSONBlob ID - shared by all users
        const BLOB_ID = '019b5dee-ba4a-73f4-bb6b-51e025c9aa86';
        const BLOB_URL = `https://jsonblob.com/api/jsonBlob/${BLOB_ID}`;

        function eventApp() {
            return {
                events: [
                    {
                        title: "Welcome & Opening Prayer",
                        description: "MC welcomes guests, introductions, opening prayer",
                        status: "pending",
                        subEvents: [
                            "MC welcomes guests",
                            "Everyone shares name & relationship to Asher",
                            "Short opening prayer"
                        ]
                    },
                    {
                        title: "Baby's Growth Video",
                        description: "Slideshow of pregnancy, milestones, first steps",
                        status: "pending",
                        subEvents: [
                            "Pregnancy / newborn days",
                            "Monthly milestones",
                            "First smile, crawl, steps",
                            "Happy 1st Birthday finale!"
                        ]
                    },
                    {
                        title: "Fun Icebreaker",
                        description: "Games and trivia with prizes",
                        status: "pending",
                        subEvents: [
                            "Guess Baby's Age using photos",
                            "Baby Trivia (first word, favorite food, birth time)",
                            "Prizes for winners"
                        ]
                    },
                    {
                        title: "Refreshments Break",
                        description: "Small chops, fruits, mingling, candid photos",
                        status: "pending",
                        subEvents: [
                            "Small chops & fruits served",
                            "Guests mingle",
                            "Background music",
                            "Candid photos"
                        ]
                    },
                    {
                        title: "Cake Cutting Ceremony",
                        description: "Birthday song, cake cutting, wishes, photos",
                        status: "pending",
                        subEvents: [
                            "Birthday song",
                            "Parents help Asher cut cake",
                            "Wishes from guests",
                            "Photo moment"
                        ]
                    },
                    {
                        title: "Games & Entertainment",
                        description: "Dance moments, challenges, competitions",
                        status: "pending",
                        subEvents: [
                            "Toddler-friendly dance moment",
                            "MC-led mini dance challenge",
                            "Fun competitions"
                        ]
                    },
                    {
                        title: "Closing Remarks",
                        description: "Thank-you by parents, appreciation to guests",
                        status: "pending",
                        subEvents: [
                            "Thank-you by parents",
                            "Appreciation to all guests"
                        ]
                    },
                    {
                        title: "Final Photos & Wind Down",
                        description: "Family photos, guests say goodbye",
                        status: "pending",
                        subEvents: [
                            "Family photos",
                            "Guests say goodbye"
                        ]
                    }
                ],
                expandedIndex: null,
                isAdmin: false,
                showPinModal: false,
                pin: '',
                pinError: false,
                loading: true,
                pollInterval: null,

                async init() {
                    await this.loadState();
                    this.loading = false;
                    this.startPolling();
                },

                async loadState() {
                    try {
                        // Add cache-busting to prevent stale data
                        const response = await fetch(`${BLOB_URL}?_=${Date.now()}`, {
                            cache: 'no-store'
                        });
                        if (response.ok) {
                            const data = await response.json();
                            if (data.events) {
                                this.events = data.events;
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load state:', e);
                    }
                },

                async saveState() {
                    try {
                        await fetch(BLOB_URL, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ events: this.events })
                        });
                    } catch (e) {
                        console.error('Failed to save state:', e);
                    }
                },

                startPolling() {
                    // Poll every 3 seconds
                    this.pollInterval = setInterval(() => {
                        if (!this.isAdmin) {
                            this.loadState();
                        }
                    }, 3000);
                },

                checkPin() {
                    if (this.pin === ADMIN_PIN) {
                        this.isAdmin = true;
                        this.showPinModal = false;
                        this.pin = '';
                        this.pinError = false;
                    } else {
                        this.pinError = true;
                        this.pin = '';
                        setTimeout(() => this.pinError = false, 1000);
                    }
                },

                logout() {
                    this.isAdmin = false;
                },

                toggleExpand(index) {
                    if (this.expandedIndex === index) {
                        this.expandedIndex = null;
                    } else {
                        this.expandedIndex = index;
                    }
                },

                isExpanded(index) {
                    // Auto-expand ongoing events, or manually expanded
                    return this.events[index].status === 'ongoing' || this.expandedIndex === index;
                },

                async startEvent(index) {
                    // Complete any ongoing event first
                    this.events.forEach((e, i) => {
                        if (e.status === 'ongoing') {
                            this.events[i].status = 'completed';
                        }
                    });
                    this.events[index].status = 'ongoing';
                    await this.saveState();
                },

                async completeEvent(index) {
                    this.events[index].status = 'completed';

                    // Auto-start next pending event
                    const nextPending = this.events.findIndex((e, i) => i > index && e.status === 'pending');
                    if (nextPending !== -1) {
                        this.events[nextPending].status = 'ongoing';
                    }

                    await this.saveState();
                },

                async resetEvent(index) {
                    this.events[index].status = 'pending';
                    await this.saveState();
                },

                async resetAll() {
                    if (confirm('Reset all events to pending?')) {
                        this.events.forEach(e => e.status = 'pending');
                        await this.saveState();
                    }
                }
            };
        }
    </script>
</body>
</html>
