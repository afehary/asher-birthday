<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asher's 1st Birthday - QR Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @page {
            size: A4;
            margin: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #79C9C5 0%, #FFE2AF 50%, #3F9AAE 100%);
            padding: 0;
        }

        .card {
            background: linear-gradient(135deg, #79C9C5 0%, #FFE2AF 50%, #3F9AAE 100%);
            padding: 80px 60px;
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            font-size: 80px;
        }

        .balloon-tl { top: 40px; left: 40px; transform: rotate(-15deg); }
        .balloon-tr { top: 40px; right: 40px; transform: rotate(15deg); }
        .balloon-bl { bottom: 40px; left: 40px; transform: rotate(-10deg); }
        .balloon-br { bottom: 40px; right: 40px; transform: rotate(10deg); }

        h1 {
            color: #3F9AAE;
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #2d7a8a;
            font-size: 28px;
            margin-bottom: 50px;
        }

        .qr-container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            margin-bottom: 50px;
            display: inline-block;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .qr-code {
            width: 320px;
            height: 320px;
            border-radius: 16px;
        }

        .instructions {
            background: linear-gradient(135deg, #3F9AAE 0%, #2d7a8a 100%);
            color: white;
            border-radius: 24px;
            padding: 35px 50px;
            box-shadow: 0 10px 40px rgba(63, 154, 174, 0.3);
        }

        .instructions h2 {
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .steps {
            text-align: left;
            font-size: 20px;
            line-height: 2;
        }

        .steps li {
            margin-bottom: 8px;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="balloon balloon-tl">🎈</span>
        <span class="balloon balloon-tr">🎈</span>
        <span class="balloon balloon-bl">🎈</span>
        <span class="balloon balloon-br">🎈</span>

        <h1>Asher Turns ONE</h1>
        <p class="subtitle">Birthday Celebration</p>

        <div class="qr-container">
            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://afehary.github.io/asher-birthday/&color=3F9AAE&margin=10"
                alt="QR Code"
                class="qr-code"
            >
        </div>

        <div class="instructions">
            <h2>How to Follow Along</h2>
            <ol class="steps">
                <li>Scan the QR code with your phone camera</li>
                <li>Open the link that appears</li>
                <li>Watch the event progress in real-time!</li>
            </ol>
        </div>

    </div>
</body>
</html>
